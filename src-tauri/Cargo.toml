[package]
name = "notary-662-app"
version = "1.0.0"
description = "Notary Office 662 Tehran App"
authors = ["Notary 662 Tehran - Leila Farajzadeh"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
